<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>FokusYou</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <span class="brand">FokusYou</span>
        <h1 id="greeting">Guten Morgen</h1>
        <p class="muted" id="todayDate"></p>
      </div>
      <button class="round-btn" id="profileButton" aria-label="Profil öffnen">FY</button>
    </header>

    <main>
      <section class="hero-card card">
        <div class="level-block">
          <span class="eyebrow">Dein Fortschritt</span>
          <h2>Level <span id="levelNumber">1</span></h2>
          <p><strong id="xpNumber">0</strong> XP gesammelt</p>
          <div class="xp-track" aria-label="Level-Fortschritt">
            <span id="xpBar"></span>
          </div>
          <small id="xpNext" class="muted"></small>
        </div>
        <div class="level-orb">
          <span id="levelOrb">1</span>
        </div>
      </section>

      <section class="quick-grid">
        <article class="mini-card card">
          <span>🔥</span>
          <strong id="bestStreak">0</strong>
          <small>Beste Serie</small>
        </article>
        <article class="mini-card card">
          <span>🏆</span>
          <strong id="successCount">0</strong>
          <small>Erfolge</small>
        </article>
        <article class="mini-card card">
          <span>✅</span>
          <strong id="todayDone">0/0</strong>
          <small>Heute</small>
        </article>
      </section>

      <section class="section-head">
        <div>
          <span class="eyebrow">Heute</span>
          <h2>Routinen</h2>
        </div>
        <button class="primary small" id="addRoutineButton">+ Neu</button>
      </section>
      <section id="routineList" class="stack"></section>

      <section class="section-head">
        <div>
          <span class="eyebrow">Dein Weg</span>
          <h2>Ziele</h2>
        </div>
        <button class="primary small" id="addGoalButton">+ Neu</button>
      </section>
      <section id="goalList" class="stack"></section>

      <section class="section-head">
        <div>
          <span class="eyebrow">Balance</span>
          <h2>Lebensbereiche</h2>
        </div>
      </section>
      <section id="areaList" class="area-grid"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="today">🏠<span>Heute</span></button>
      <button class="nav-item" data-page="goals">🎯<span>Ziele</span></button>
      <button class="nav-item" data-page="calendar">📅<span>Kalender</span></button>
      <button class="nav-item" data-page="work">⏱️<span>Arbeit</span></button>
    </nav>
  </div>

  <dialog id="itemDialog">
    <form id="itemForm">
      <div class="dialog-head">
        <div>
          <span class="eyebrow" id="dialogLabel">Neu</span>
          <h2 id="dialogTitle">Eintrag hinzufügen</h2>
        </div>
        <button type="button" class="round-btn close" id="closeDialog">✕</button>
      </div>

      <label>
        Name
        <input id="itemName" maxlength="60" placeholder="z. B. 20 Minuten spazieren" required />
      </label>

      <label>
        Lebensbereich
        <select id="itemArea">
          <option value="health">❤️ Gesundheit</option>
          <option value="work">💼 Arbeit</option>
          <option value="finance">💰 Finanzen</option>
          <option value="family">👨‍👩‍👧 Familie</option>
          <option value="learning">📚 Lernen</option>
          <option value="leisure">🎮 Freizeit</option>
        </select>
      </label>

      <div id="goalFields">
        <label>
          Zielwert
          <input id="itemTarget" type="number" min="1" value="10" />
        </label>
        <label>
          Einheit
          <input id="itemUnit" maxlength="20" value="Schritte" />
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelDialog">Abbrechen</button>
        <button class="primary" type="submit">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="infoDialog">
    <div class="info-box">
      <button class="round-btn close info-close" id="closeInfo">✕</button>
      <span class="eyebrow">Demnächst</span>
      <h2 id="infoTitle">Dieses Modul folgt</h2>
      <p class="muted" id="infoText"></p>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
